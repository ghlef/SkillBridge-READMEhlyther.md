<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <title>World Clock</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #10131c;
      color: #f5f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #9da5b8;
      --line: rgba(255,255,255,.09);
      --accent: #9b8cff;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(ellipse at 50% -20%, #282443 0, #151724 42%, #10131c 75%);
    }
    .shell { width: min(1050px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0 48px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 32px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font-size: .73rem; font-weight: 750; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2.2rem, 6vw, 3.5rem); letter-spacing: -.055em; line-height: 1; }
    .subtitle { margin: 13px 0 0; color: var(--muted); font-size: .98rem; }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    select, button { min-height: 42px; border: 1px solid var(--line); border-radius: 11px; background: #1b1e2b; color: #f5f6fb; font: inherit; }
    select { max-width: 235px; padding: 0 34px 0 12px; }
    button { padding: 0 14px; cursor: pointer; transition: background .18s, border-color .18s, transform .18s; }
    button:hover { background: #29263d; border-color: #655b99; }
    button:active { transform: translateY(1px); }
    .clock-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .clock-card {
      position: relative; min-height: 202px; padding: 24px; overflow: hidden;
      border: 1px solid var(--line); border-radius: 18px;
      background: linear-gradient(145deg, rgba(35,38,54,.96), rgba(24,27,39,.94));
      box-shadow: 0 14px 40px rgba(0,0,0,.14);
    }
    .clock-card::after { position: absolute; top: -50px; right: -55px; width: 150px; height: 150px; border-radius: 50%; background: rgba(155,140,255,.07); content: ""; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .city { margin: 0; font-size: 1.08rem; font-weight: 650; letter-spacing: -.015em; }
    .zone { margin: 5px 0 0; color: var(--muted); font-size: .82rem; }
    .remove { z-index: 1; display: grid; width: 32px; min-height: 32px; padding: 0; place-items: center; border-radius: 9px; color: var(--muted); font-size: 1.1rem; }
    .time { margin: 22px 0 0; font-variant-numeric: tabular-nums; font-size: clamp(2.25rem, 6vw, 3.35rem); font-weight: 600; letter-spacing: -.055em; line-height: 1; white-space: nowrap; }
    .date-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 13px; color: var(--muted); font-size: .82rem; }
    .day { color: #c6bfff; }
    .empty { grid-column: 1 / -1; padding: 48px 24px; border: 1px dashed var(--line); border-radius: 18px; color: var(--muted); text-align: center; }
    footer { margin-top: 20px; color: #777f91; font-size: .78rem; text-align: center; }
    @media (max-width: 650px) {
      .shell { width: min(100% - 28px, 480px); padding-top: 38px; }
      header { align-items: flex-start; flex-direction: column; }
      .toolbar { width: 100%; }
      select { flex: 1; min-width: 0; }
      .clock-grid { grid-template-columns: 1fr; gap: 12px; }
      .clock-card { min-height: 184px; padding: 21px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Time, everywhere</p>
        <h1>World clock<span style="color:var(--accent)">.</span></h1>
        <p class="subtitle">The right now, wherever you are.</p>
      </div>
      <div class="toolbar" aria-label="Clock controls">
        <select id="zone-select" aria-label="Choose a time zone">
          <option value="">Add a time zone…</option>
        </select>
        <button id="format-toggle" type="button" aria-label="Switch to 24-hour time">24-hour</button>
      </div>
    </header>
    <section id="clock-grid" class="clock-grid" aria-label="Current times by time zone" aria-live="off"></section>
    <footer>Times update every second and use your device’s current clock.</footer>
  </main>
  <script>
    (() => {
      const zoneNames = new Intl.DisplayNames(undefined, { type: 'timeZone' });
      const zones = [
        'America/Los_Angeles',
        'America/New_York',
        'Europe/London',
        'Europe/Paris',
        'Asia/Dubai',
        'Asia/Tokyo',
        'Australia/Sydney'
      ];
      const select = document.querySelector('#zone-select');
      const grid = document.querySelector('#clock-grid');
      const formatButton = document.querySelector('#format-toggle');
      let use24Hour = false;

      const availableZones = [...new Set(Intl.supportedValuesOf('timeZone'))];
      for (const zone of availableZones) {
        const option = document.createElement('option');
        option.value = zone;
        option.textContent = `${zoneNames.of(zone)} (${zone.replaceAll('_', ' ')})`;
        select.append(option);
      }

      function render() {
        const now = new Date();
        grid.replaceChildren();
        if (zones.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = 'No clocks yet — add a time zone to get started.';
          grid.append(empty);
          return;
        }

        for (const zone of zones) {
          const card = document.createElement('article');
          card.className = 'clock-card';
          const city = zoneNames.of(zone) || zone;
          const time = new Intl.DateTimeFormat(undefined, {
            timeZone: zone, hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: !use24Hour
          }).format(now);
          const date = new Intl.DateTimeFormat(undefined, {
            timeZone: zone, weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
          }).format(now);
          const offset = new Intl.DateTimeFormat(undefined, {
            timeZone: zone, timeZoneName: 'shortOffset'
          }).formatToParts(now).find(part => part.type === 'timeZoneName')?.value || '';

          const top = document.createElement('div');
          top.className = 'card-top';
          const location = document.createElement('div');
          const title = document.createElement('h2');
          title.className = 'city';
          title.textContent = city;
          const zoneLabel = document.createElement('p');
          zoneLabel.className = 'zone';
          zoneLabel.textContent = zone.replaceAll('_', ' ');
          location.append(title, zoneLabel);
          const remove = document.createElement('button');
          remove.className = 'remove';
          remove.type = 'button';
          remove.textContent = '×';
          remove.setAttribute('aria-label', `Remove ${city} clock`);
          remove.addEventListener('click', () => {
            zones.splice(zones.indexOf(zone), 1);
            render();
          });
          top.append(location, remove);

          const timeElement = document.createElement('p');
          timeElement.className = 'time';
          timeElement.textContent = time;
          const dateRow = document.createElement('div');
          dateRow.className = 'date-row';
          const dateElement = document.createElement('span');
          dateElement.textContent = date;
          const offsetElement = document.createElement('span');
          offsetElement.className = 'day';
          offsetElement.textContent = offset;
          dateRow.append(dateElement, offsetElement);
          card.append(top, timeElement, dateRow);
          grid.append(card);
        }
      }

      select.addEventListener('change', () => {
        const zone = select.value;
        if (zone && !zones.includes(zone)) zones.push(zone);
        select.value = '';
        render();
      });
      formatButton.addEventListener('click', () => {
        use24Hour = !use24Hour;
        formatButton.textContent = use24Hour ? '12-hour' : '24-hour';
        formatButton.setAttribute('aria-label', `Switch to ${use24Hour ? '12' : '24'}-hour time`);
        render();
      });

      render();
      window.setInterval(render, 1000);
    })();
  </script>
</body>
</html>
